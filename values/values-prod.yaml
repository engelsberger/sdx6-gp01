replicaCount: 3

image:
  repository: recipe-api
  tag: "1.0.0"
  pullPolicy: Always

dbUser: user
dbPassword: ""
dbHost: postgres
dbName: recipes

service:
  type: ClusterIP
  port: 80

securityContext:
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: recipe.prod.at
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - recipe.prod.at
      secretName: recipe-tls

podSecurityContext: {}